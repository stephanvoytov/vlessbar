name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # macOS runner: has hdiutil (dmg), ditto (perm-preserving zip), codesign.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Test engine
        run: cd engine && go test ./...

      - name: Build app, zip and dmg
        run: |
          chmod +x build-macos.sh
          GO=go ./build-macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VLessBar-macos10.13
          path: |
            dist/VLessBar-macos10.13.zip
            dist/VLessBar.dmg
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VLessBar-macos10.13.zip
            dist/VLessBar.dmg
