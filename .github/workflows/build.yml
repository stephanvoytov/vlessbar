name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # macOS runner: has hdiutil (dmg), ditto (perm-preserving zip), codesign.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Test engine
        run: cd engine && go test ./...

      - name: Validate AppleScript UI compiles
        run: osacompile -o "$RUNNER_TEMP/ui.scpt" app/ui.applescript && echo "UI AppleScript compiles OK"

      - name: Build app, zip and dmg
        run: |
          chmod +x build-macos.sh
          GO=go ./build-macos.sh

      - name: Smoke test (execute the shipped x86_64 binaries)
        continue-on-error: true
        run: |
          set -x
          eng=dist/VLessBar.app/Contents/MacOS/VLessBar
          xr=dist/VLessBar.app/Contents/Resources/xray
          file "$eng" "$xr"
          /usr/bin/otool -l "$eng" | grep -A3 LC_BUILD_VERSION || true
          sudo softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          echo "--- engine version ---"; arch -x86_64 "$eng" version
          echo "--- engine hwid ---";    arch -x86_64 "$eng" hwid
          echo "--- xray version ---";   arch -x86_64 "$xr" version | head -3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VLessBar-macos10.13
          path: |
            dist/VLessBar-macos10.13.zip
            dist/VLessBar.dmg
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VLessBar-macos10.13.zip
            dist/VLessBar.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Test engine
        run: cd engine; go test ./...

      - name: Build engine
        run: cd engine; $env:GOOS='windows'; $env:GOARCH='amd64'; go build -o ..\dist-win\VLessBar.exe .

      - name: Bundle xray core (pinned for Windows 7 support)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          if (-not (Test-Path 'dist-win\xray.exe')) {
            $zip = "$env:TEMP\xray.zip"
            Invoke-WebRequest -Uri 'https://github.com/XTLS/Xray-core/releases/download/v1.8.3/Xray-windows-64.zip' -OutFile $zip
            Expand-Archive $zip -DestinationPath dist-win -Force
            if (-not (Test-Path 'dist-win\xray.exe')) { throw 'xray.exe not extracted' }
          }

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item README.md dist-win\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist-win\* -DestinationPath VLessBar-windows-x64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VLessBar-windows-x64
          path: VLessBar-windows-x64.zip
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VLessBar-windows-x64.zip
