name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # macOS runner: has hdiutil (dmg), ditto (perm-preserving zip), codesign.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Test engine
        run: cd engine && go test ./...

      - name: Debug AppleScript compile
        if: always()
        run: |
          set +e
          SR=app/ui.applescript
          echo "=== 0 baseline full ==="
          osacompile -o /tmp/0.scpt "$SR"; echo "0 rc=$?"

          echo "=== 1 stub installApp ==="
          { sed -n '1,48p' "$SR"; printf 'on installApp(bundlePath, homeDir, installedSystem, installedUser)\nend installApp\n'; sed -n '62,$p' "$SR"; } > /tmp/1.applescript
          osacompile -o /tmp/1.scpt /tmp/1.applescript; echo "1 rc=$?"

          echo "=== 2 stub menuLoop ==="
          { sed -n '1,62p' "$SR"; printf 'on menuLoop()\nend menuLoop\n'; sed -n '93,$p' "$SR"; } > /tmp/2.applescript
          osacompile -o /tmp/2.scpt /tmp/2.applescript; echo "2 rc=$?"

          echo "=== 3 stub run+runMain ==="
          { sed -n '1,10p' "$SR"; printf 'on run argv\n\tmy runMain("")\nend run\non runMain(bundlePath)\n\tmy menuLoop()\nend runMain\n'; sed -n '48,$p' "$SR"; } > /tmp/3.applescript
          osacompile -o /tmp/3.scpt /tmp/3.applescript; echo "3 rc=$?"

          echo "=== 4 strip all non-ASCII ==="
          python3 -c "d=open('$SR',encoding='utf-8').read();open('/tmp/4.applescript','w',encoding='utf-8').write(''.join(c if ord(c)<128 else 'x' for c in d))"
          osacompile -o /tmp/4.scpt /tmp/4.applescript; echo "4 rc=$?"

          echo "=== 5 run+runMain only + stubs ==="
          { sed -n '1,47p' "$SR"; printf 'on installApp(a, b, c, d)\nend installApp\non menuLoop()\nend menuLoop\non askButtons(a, b, c)\nend askButtons\non notifyError(a)\nend notifyError\n'; } > /tmp/5.applescript
          osacompile -o /tmp/5.scpt /tmp/5.applescript; echo "5 rc=$?"

          echo "=== 6 menuLoop only + stubs ==="
          { printf 'on getState()\nend getState\non pick(a, b, c)\nend pick\non doAction(a)\nend doAction\non changeServer()\nend changeServer\non addSubscription()\nend addSubscription\non notifyInfo(a)\nend notifyInfo\non runEng(a)\nend runEng\n'; sed -n '63,92p' "$SR"; } > /tmp/6.applescript
          osacompile -o /tmp/6.scpt /tmp/6.applescript; echo "6 rc=$?"

      - name: Validate AppleScript UI compiles
        run: osacompile -o "$RUNNER_TEMP/ui.scpt" app/ui.applescript && echo "UI AppleScript compiles OK"

      - name: Build app, zip and dmg
        run: |
          chmod +x build-macos.sh
          GO=go ./build-macos.sh

      - name: Smoke test (execute the shipped x86_64 binaries)
        continue-on-error: true
        run: |
          set -x
          eng=dist/VLessBar.app/Contents/MacOS/VLessBar
          xr=dist/VLessBar.app/Contents/Resources/xray
          file "$eng" "$xr"
          /usr/bin/otool -l "$eng" | grep -A3 LC_BUILD_VERSION || true
          sudo softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          echo "--- engine version ---"; arch -x86_64 "$eng" version
          echo "--- engine hwid ---";    arch -x86_64 "$eng" hwid
          echo "--- xray version ---";   arch -x86_64 "$xr" version | head -3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VLessBar-macos10.13
          path: |
            dist/VLessBar-macos10.13.zip
            dist/VLessBar.dmg
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VLessBar-macos10.13.zip
            dist/VLessBar.dmg
